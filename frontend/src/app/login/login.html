  <div class="row g-3 mt-3">
  </div>


    <div class="card shadow p-4 border-0 rounded-3" style="background-color:#dc9f1c ">
      <div class="row g-3">
   
        <div class="col-12 ">
      <div class="form-floating mb-3" >
        <input type="text" class="form-control" id="firstNameId" placeholder="WeLovePommes" [(ngModel)]="username" >
        <label for="firstNameId">Username</label>
      </div>
    </div>


    <div class="col-12">
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="passwordId" placeholder="AnnaIsAwesome" [(ngModel)]="password">
        <label for="passwordId">Password</label>
      </div>
    </div>

    @if(errorMessage){
      <p class="text-danger">{{errorMessage}}</p>
    }

    <div class="d-grid gap-2 d-md-flex justify-content-md-end" mt-2>
      <button type="button" class="btn btn-secondary me-md-2 " (click)="goBack()">Abbrechen</button>
      <button type="button" class="btn btn-primary" (click)="login()">Login</button>
    </div>
