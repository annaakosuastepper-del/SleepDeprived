<app-nav></app-nav>

<div class="container-fluid " style="background-color: #301554; color: #F6C45C">
    
    <div class="row">
        <div class="col-12"> <h1 class = "title">Editing Page: {{name}} Section: {{field}} </h1>  </div>
     </div>

     <form [formGroup]="form" (ngSubmit)="update()">
        <div class="row g-3 mt-2 px-3 d-flex justify-content-center">
              <div class="float-wrapper">
                <img src="assets/star.png" class="floating-img"
            [style.transform]="'translate(' + img1X + 'px, ' + img1Y + 'px)'">
        </div>  
  
            <div class="col-6">

            @if (field == 'bio'){
                <quill-editor type="text" formControlName="bioControl"></quill-editor>
            }
             @if (field == 'role'){
                <quill-editor type="text" formControlName="roleControl"></quill-editor>
            }
            @if (field == 'boxes'){
                <quill-editor [format]="'html'" formControlName="titleControl"></quill-editor>
                <quill-editor [format]="'html'" formControlName="contentControl"></quill-editor>
            }
             @if (field == 'skills'){
                <quill-editor type="text" formControlName="skillsControl"></quill-editor>
            }
       </div>
       <div class="float-wrapper">
                <img src="assets/star.png" class="floating-img"
            [style.transform]="'translate(' + img2X + 'px, ' + img2Y + 'px)'">
        </div>  
        </div>
         <div class="row gx-0 mt-5 d-flex justify-content-center">
             <button type="button" class="col-3 btn " style="background-color: rgb(144, 195, 243);"(click)="cancel()">Abbrechen</button>
          <div class="col-2"></div>
             <button type="submit" class="col-3 btn " style ="background-color: rgb(184, 86, 209);">Aktualisieren</button>
          
         
        </div>
     </form>
 
</div>
